<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwitchBot Temperature Monitor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0 }
  body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; background: #0a0a0a; color: #f0f0f0; padding: 20px; max-width: 480px; margin: 0 auto; }
  h1 { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .sub { font-size: 12px; color: #666; margin-bottom: 20px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; margin-bottom: 20px; }
  .badge.good { background: rgba(52,199,89,0.15); color: #34c759; border: 1px solid rgba(52,199,89,0.3); }
  .badge.warn { background: rgba(255,159,10,0.15); color: #ff9f0a; border: 1px solid rgba(255,159,10,0.3); }
  .badge.bad  { background: rgba(255,69,58,0.15);  color: #ff453a; border: 1px solid rgba(255,69,58,0.3); }
  .badge.wait { background: rgba(255,255,255,0.08); color: #888; border: 1px solid rgba(255,255,255,0.1); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .dot.pulse { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .section { background: #161616; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #222; }
  .section-title { font-size: 10px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #1e1e1e; }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { font-size: 12px; color: #888; }
  .stat-value { font-size: 13px; font-weight: 700; color: #f0f0f0; font-variant-numeric: tabular-nums; }
  .stat-value.green { color: #34c759; }
  .stat-value.amber { color: #ff9f0a; }
  .stat-value.red { color: #ff453a; }
  .timeline { display: flex; flex-direction: column; gap: 6px; }
  .slot { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; background: #1a1a1a; border: 1px solid #222; }
  .slot.received { border-color: rgba(52,199,89,0.3); background: rgba(52,199,89,0.06); }
  .slot.next { border-color: rgba(255,159,10,0.4); background: rgba(255,159,10,0.06); animation: glow 2s infinite; }
  .slot.future { opacity: 0.4; }
  @keyframes glow { 0%,100%{border-color:rgba(255,159,10,0.4)} 50%{border-color:rgba(255,159,10,0.8)} }
  .slot-time { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 46px; color: #ccc; }
  .slot-icon { font-size: 14px; }
  .slot-val { font-size: 13px; font-weight: 700; margin-left: auto; font-variant-numeric: tabular-nums; }
  .slot-val.got { color: #34c759; }
  .slot-val.next { color: #ff9f0a; }
  .slot-val.future { color: #444; }
  .countdown { font-size: 11px; color: #ff9f0a; margin-left: auto; }
  .latest-big { text-align: center; padding: 16px; }
  .latest-temp { font-size: 48px; font-weight: 700; color: #34c759; font-variant-numeric: tabular-nums; }
  .latest-meta { font-size: 12px; color: #555; margin-top: 4px; }
  #refreshing { font-size: 11px; color: #444; text-align: right; margin-top: 12px; }
</style>
</head>
<body>

<h1>🌡 SwitchBot Temperature Monitor</h1>
<p class="sub">Polling every 15 minutes · refreshes every 30s</p>

<div id="badge" class="badge wait"><span class="dot pulse"></span> Loading...</div>

<div class="section">
  <div class="section-title">Current reading</div>
  <div id="latest" class="latest-big" style="color:#444">No data yet</div>
</div>

<div class="section">
  <div class="section-title">Last 24h statistics</div>
  <div id="stats"></div>
</div>

<div class="section">
  <div class="section-title">Next 2 hours — expected data points</div>
  <div id="timeline" class="timeline"></div>
</div>

<div id="refreshing">Refreshing...</div>

<script>
let readings = []
let countdownInterval = null

function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
}

function fmtTemp(c, f) {
  return `${f}°F / ${c}°C`
}

function nextSlots() {
  // Generate next 8 quarter-hour slots from now
  const slots = []
  const now = new Date()
  // Round up to next 15-min boundary
  const mins = now.getMinutes()
  const nextMins = Math.ceil((mins + 1) / 15) * 15
  const base = new Date(now)
  base.setMinutes(nextMins, 0, 0)
  for (let i = 0; i < 8; i++) {
    const t = new Date(base.getTime() + i * 15 * 60 * 1000)
    slots.push(t)
  }
  return slots
}

function render() {
  const now = new Date()

  // ── Latest reading ──
  const latest = readings[0]
  const latestEl = document.getElementById('latest')
  if (latest) {
    const age = Math.round((now - new Date(latest.recorded_at)) / 60000)
    latestEl.innerHTML = `
      <div class="latest-temp">${latest.temperature_f}°F</div>
      <div class="latest-meta">${latest.temperature_c}°C · ${latest.humidity}% humidity</div>
      <div class="latest-meta">${fmtTime(latest.recorded_at)} · ${age < 2 ? 'just now' : age + ' min ago'}</div>
    `
  } else {
    latestEl.innerHTML = `<div style="color:#444;font-size:13px">No readings yet</div>`
  }

  // ── Badge ──
  const badge = document.getElementById('badge')
  const last24 = readings.filter(r => now - new Date(r.recorded_at) < 24*60*60*1000)
  const expected24 = 24 * 4 // 96 polls in 24h
  const rate = last24.length > 0 ? Math.min(100, Math.round(last24.length / Math.min(expected24, Math.ceil((now - new Date(now.getTime() - 24*60*60*1000)) / (15*60*1000))) * 100)) : 0
  const ageMinutes = latest ? Math.round((now - new Date(latest.recorded_at)) / 60000) : 999

  let badgeClass, badgeText
  if (!latest) {
    badgeClass = 'wait'; badgeText = '⏳ No data yet — waiting for first poll'
  } else if (ageMinutes <= 20) {
    badgeClass = 'good'; badgeText = `✓ Live — last reading ${ageMinutes}m ago`
  } else if (ageMinutes <= 45) {
    badgeClass = 'warn'; badgeText = `⚠ Delayed — last reading ${ageMinutes}m ago`
  } else {
    badgeClass = 'bad'; badgeText = `✗ Stale — last reading ${ageMinutes}m ago`
  }
  badge.className = `badge ${badgeClass}`
  badge.innerHTML = `<span class="dot${badgeClass==='good'?' pulse':''}"></span> ${badgeText}`

  // ── Stats ──
  const statsEl = document.getElementById('stats')
  if (last24.length > 0) {
    const temps = last24.map(r => r.temperature_f)
    const avgT = (temps.reduce((a,b)=>a+b,0)/temps.length).toFixed(1)
    const minT = Math.min(...temps)
    const maxT = Math.max(...temps)
    const humids = last24.map(r => r.humidity)
    const avgH = Math.round(humids.reduce((a,b)=>a+b,0)/humids.length)

    // Expected = polls since the earliest reading (or 24h window start, whichever is later)
    const windowStart = new Date(Math.max(now - 24*60*60*1000, new Date(readings[readings.length-1]?.recorded_at || now)))
    const hoursActive = (now - windowStart) / (60 * 60 * 1000)
    const expectedPolls = Math.max(1, Math.round(hoursActive * 4))
    const successRate = Math.min(100, Math.round(last24.length / expectedPolls * 100))
    const rateColor = successRate >= 80 ? 'green' : successRate >= 50 ? 'amber' : 'red'

    statsEl.innerHTML = `
      <div class="stat-row"><span class="stat-label">Readings received</span><span class="stat-value ${rateColor}">${last24.length} / ${expectedPolls} expected</span></div>
      <div class="stat-row"><span class="stat-label">Success rate</span><span class="stat-value ${rateColor}">${successRate}%</span></div>
      <div class="stat-row"><span class="stat-label">Avg temperature</span><span class="stat-value">${avgT}°F</span></div>
      <div class="stat-row"><span class="stat-label">Range</span><span class="stat-value">${minT}–${maxT}°F</span></div>
      <div class="stat-row"><span class="stat-label">Avg humidity</span><span class="stat-value">${avgH}%</span></div>
      <div class="stat-row"><span class="stat-label">Last received</span><span class="stat-value">${latest ? fmtTime(latest.recorded_at) : '—'}</span></div>
    `
  } else {
    statsEl.innerHTML = `<div class="stat-row"><span class="stat-label" style="color:#555">No readings in last 24h</span></div>`
  }

  // ── Timeline ──
  const slots = nextSlots()
  const timelineEl = document.getElementById('timeline')
  const isNext = (slot) => {
    const diff = slot - now
    return diff > 0 && diff < 16 * 60 * 1000 // within 16 min window = next expected
  }

  // Find readings close to each slot (within 8 min)
  const slotHtml = slots.map((slot, i) => {
    const match = readings.find(r => Math.abs(new Date(r.recorded_at) - slot) < 8 * 60 * 1000)
    const isPast = slot < now
    const isNextSlot = !isPast && slots.findIndex(s => s > now) === i

    if (match) {
      return `<div class="slot received">
        <span class="slot-time">${fmtTime(slot)}</span>
        <span class="slot-icon">✅</span>
        <span class="slot-val got">${match.temperature_f}°F · ${match.humidity}%</span>
      </div>`
    } else if (isPast) {
      return `<div class="slot" style="opacity:0.3">
        <span class="slot-time">${fmtTime(slot)}</span>
        <span class="slot-icon">❌</span>
        <span class="slot-val" style="color:#ff453a">missed</span>
      </div>`
    } else if (isNextSlot) {
      const secLeft = Math.round((slot - now) / 1000)
      const minLeft = Math.floor(secLeft / 60)
      const secRem = secLeft % 60
      return `<div class="slot next" id="next-slot-${i}">
        <span class="slot-time">${fmtTime(slot)}</span>
        <span class="slot-icon">⏳</span>
        <span class="countdown" id="countdown">${minLeft}m ${String(secRem).padStart(2,'0')}s</span>
      </div>`
    } else {
      return `<div class="slot future">
        <span class="slot-time">${fmtTime(slot)}</span>
        <span class="slot-icon">🕐</span>
        <span class="slot-val future">expected</span>
      </div>`
    }
  }).join('')
  timelineEl.innerHTML = slotHtml

  // Live countdown
  if (countdownInterval) clearInterval(countdownInterval)
  countdownInterval = setInterval(() => {
    const cd = document.getElementById('countdown')
    if (!cd) { clearInterval(countdownInterval); return }
    const nextSlot = slots.find(s => s > new Date())
    if (!nextSlot) return
    const secLeft = Math.round((nextSlot - new Date()) / 1000)
    if (secLeft <= 0) { fetchData(); return }
    const minLeft = Math.floor(secLeft / 60)
    const secRem = secLeft % 60
    cd.textContent = `${minLeft}m ${String(secRem).padStart(2,'0')}s`
  }, 1000)
}

async function fetchData() {
  document.getElementById('refreshing').textContent = `Fetching... ${new Date().toLocaleTimeString()}`
  try {
    const res = await fetch('/.netlify/functions/temp-status')
    readings = await res.json()
    render()
    document.getElementById('refreshing').textContent = `Last refreshed: ${new Date().toLocaleTimeString()}`
  } catch(e) {
    document.getElementById('refreshing').textContent = `Error: ${e.message}`
  }
}

// Initial fetch + refresh every 30s
fetchData()
setInterval(fetchData, 30000)
</script>
</body>
</html>
