[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Clean route for the standalone SwitchBot monitor (must precede the SPA catch-all)
[[redirects]]
  from = "/home"
  to = "/temp-monitor.html"
  status = 200

# SPA fallback for the React app — keep last so specific rules win
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[functions."claude-proxy"]
  node_bundler = "esbuild"

[functions."switchbot-poll"]
  schedule = "*/15 * * * *"

[functions."plaid-sync"]
  schedule = "0 11 * * *"
