[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[functions."claude-proxy"]
  node_bundler = "esbuild"

[functions."switchbot-poll"]
  schedule = "*/15 * * * *"

[functions."plaid-sync"]
  schedule = "0 11 * * *"
